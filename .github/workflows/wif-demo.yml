name: WIF Demo

on:
  push:

jobs:
  demo:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: "projects/83814747678/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
        service_account: "github-wif-sa@project-d4fa532f-546b-4bdb-921.iam.gserviceaccount.com"

    - uses: google-github-actions/setup-gcloud@v2

    - run: gcloud auth list

    - run: gcloud projects list
